packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^6
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: ^4
  vite-plus: latest
  "@viz-js/viz": ^3.28.0
  plop: ^4.0.5

overrides:
  vite: "catalog:"
  typescript: ^6

onlyBuiltDependencies:
  - msw
  - vue-demi
  - esbuild

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  msw: true
  vue-demi: true
